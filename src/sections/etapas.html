  <section class="section on-paper etapas" id="etapas" aria-labelledby="etapas-title">
    <div class="container">
      <div class="split-head">
        <div>
          <p class="eyebrow">Linha completa</p>
          <h2 id="etapas-title">Uma ferramenta certa<br>para cada etapa.</h2>
        </div>
        <p class="lead">Mais de 1.000 itens organizados para acompanhar o trabalho do começo ao fim — do primeiro corte ao brilho final.</p>
      </div>

      <div class="etapas-ui">
        <div class="etapas-tabs" role="tablist" aria-label="Etapas do trabalho em rocha">
          <button role="tab" id="tab-etapa-0" aria-controls="etapa-0" aria-selected="true" data-etapa="0"><i>01</i>Corte</button>
          <button role="tab" id="tab-etapa-1" aria-controls="etapa-1" aria-selected="false" tabindex="-1" data-etapa="1"><i>02</i>Desbaste</button>
          <button role="tab" id="tab-etapa-2" aria-controls="etapa-2" aria-selected="false" tabindex="-1" data-etapa="2"><i>03</i>Polimento</button>
          <button role="tab" id="tab-etapa-3" aria-controls="etapa-3" aria-selected="false" tabindex="-1" data-etapa="3"><i>04</i>Acabamento</button>
          <span class="etapas-rail" aria-hidden="true"><span></span></span>
        </div>
        <div class="etapas-panel" id="etapas-panel">{{etapas_panels}}</div>
      </div>

      <div class="linha-completa">
        <h3>Linha completa</h3>
        <div class="cat-cloud reveal-stagger" aria-label="Produtos da linha Maxtool">{{linha_completa}}</div>
      </div>
    </div>
  </section>
